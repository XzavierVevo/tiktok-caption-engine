<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Caption Style Preview — TikTok Caption Tool</title>
  <style>
    @font-face {
      font-family: "TikTok Sans";
      src: url("./fonts/TikTokSans-Variable.ttf") format("truetype");
      font-weight: 300 900;
      font-style: normal;
      font-display: swap;
    }

    /*
      PRODUCTION CAPTION SETTINGS
      These map 1:1 to what the real renderer will use (CSS preview ↔ FFmpeg ASS).
      Tune here first; lock them into the app after you approve the look.
    */
    :root {
      --caption-font: "TikTok Sans", system-ui, sans-serif;
      --caption-weight: 700;          /* Bold — TikTok Sans wght 700 */
      --caption-fill: #ffffff;
      --caption-stroke: #000000;
      /* Stroke as % of font-size. ~12% ≈ thick TikTok outline */
      --caption-stroke-ratio: 0.12;
      /* Font size as % of frame height (9:16 phone) */
      --caption-size-ratio: 0.055;
      /* Max text block width as % of frame width */
      --caption-max-width: 0.86;
      /* Vertical position: 0 = top, 0.5 = dead center, 1 = bottom */
      --caption-y: 0.50;
      --line-height: 1.15;
      --letter-spacing: -0.01em;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "TikTok Sans", system-ui, sans-serif;
      background: #12141a;
      color: #e8eaef;
      min-height: 100vh;
      padding: 28px 20px 48px;
    }

    h1 {
      font-weight: 700;
      font-size: 1.35rem;
      letter-spacing: -0.02em;
    }

    .sub {
      margin-top: 6px;
      color: #9aa3b2;
      font-size: 0.9rem;
      max-width: 62ch;
      line-height: 1.45;
    }

    .toolbar {
      margin: 22px 0 18px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px 16px;
      align-items: center;
    }

    .toolbar label {
      font-size: 0.78rem;
      color: #9aa3b2;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .toolbar input[type="range"] { width: 140px; }
    .toolbar output { color: #e8eaef; font-variant-numeric: tabular-nums; }

    .btn {
      appearance: none;
      border: 1px solid #3a4150;
      background: #1c212b;
      color: #e8eaef;
      font: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
    }
    .btn:hover { background: #262c38; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 18px;
      margin-top: 8px;
    }

    .card { display: flex; flex-direction: column; gap: 8px; }

    .label {
      font-size: 0.75rem;
      color: #9aa3b2;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    /* 9:16 phone frame */
    .frame {
      position: relative;
      aspect-ratio: 9 / 16;
      width: 100%;
      border-radius: 14px;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 30% 40%, #3a4a5c 0%, transparent 55%),
        linear-gradient(160deg, #1a2330 0%, #0d1016 55%, #1e2a22 100%);
      box-shadow: 0 0 0 1px #2a3140, 0 12px 40px rgba(0,0,0,0.45);
    }

    .frame.ref {
      background:
        url("./ref-caption.png") center / cover no-repeat;
    }

    .frame.blur-a {
      background:
        linear-gradient(rgba(0,0,0,0.15), rgba(0,0,0,0.15)),
        url("https://images.unsplash.com/photo-1511512578047-dfb367046420?w=600&q=60")
          center / cover no-repeat;
    }

    .frame.blur-b {
      background:
        linear-gradient(rgba(0,0,0,0.2), rgba(0,0,0,0.2)),
        url("https://images.unsplash.com/photo-1542751371-adc38448a05e?w=600&q=60")
          center / cover no-repeat;
    }

    .frame.blur-c {
      background:
        linear-gradient(120deg, #2b1d14 0%, #1a2838 50%, #142018 100%);
    }

    /* Caption layer — same markup the real tool will burn in */
    .caption {
      position: absolute;
      left: 50%;
      top: calc(var(--caption-y) * 100%);
      transform: translate(-50%, -50%);
      width: calc(var(--caption-max-width) * 100%);
      text-align: center;
      font-family: var(--caption-font);
      font-weight: var(--caption-weight);
      color: var(--caption-fill);
      line-height: var(--line-height);
      letter-spacing: var(--letter-spacing);
      /* Size set in JS from frame height × --caption-size-ratio */
      font-size: 22px;
      /* Thick black outline (TikTok-style) */
      -webkit-text-stroke: calc(1em * var(--caption-stroke-ratio)) var(--caption-stroke);
      paint-order: stroke fill;
      /* Soft shadow so stroke stays readable on busy frames */
      filter: drop-shadow(0 1px 1px rgba(0, 0, 0, 0.35));
      white-space: pre-wrap;
      word-break: normal;
      overflow-wrap: break-word;
      pointer-events: none;
      user-select: none;
    }

    .settings {
      margin-top: 28px;
      padding: 16px 18px;
      background: #1a1f28;
      border: 1px solid #2a3140;
      border-radius: 12px;
      font-size: 0.82rem;
      line-height: 1.55;
      color: #c5cad3;
      max-width: 720px;
    }

    .settings code {
      font-family: ui-monospace, Consolas, monospace;
      font-size: 0.8rem;
      color: #9ecbff;
    }

    .settings pre {
      margin-top: 10px;
      padding: 12px;
      background: #0e1117;
      border-radius: 8px;
      overflow-x: auto;
      color: #d7dde8;
      font-size: 0.78rem;
    }
  </style>
</head>
<body>
  <h1>Caption style preview</h1>
  <p class="sub">
    Open this file in your browser. Compare the reference (left) to the rendered
    samples. Tweak sliders until it matches — these values become the defaults
    for the real tool.
  </p>

  <div class="toolbar">
    <label>
      Font size (% of height)
      <input id="size" type="range" min="3.5" max="8" step="0.1" value="5.5" />
      <output id="sizeOut">5.5%</output>
    </label>
    <label>
      Stroke (% of font)
      <input id="stroke" type="range" min="6" max="18" step="0.5" value="12" />
      <output id="strokeOut">12%</output>
    </label>
    <label>
      Vertical position
      <input id="y" type="range" min="30" max="70" step="1" value="50" />
      <output id="yOut">50%</output>
    </label>
    <label>
      Weight
      <input id="weight" type="range" min="500" max="800" step="100" value="700" />
      <output id="weightOut">700</output>
    </label>
    <button class="btn" type="button" id="reset">Reset defaults</button>
  </div>

  <div class="grid" id="grid">
    <!-- cards injected by JS -->
  </div>

  <div class="settings">
    <strong>Locked settings object</strong> (what the real bot will use once you approve):
    <pre id="settingsDump"></pre>
  </div>

  <script>
    /**
     * CAPTION_STYLE — shared config for preview + production burn-in.
     * Keep this object in sync with the backend ASS / canvas renderer.
     */
    const CAPTION_STYLE = {
      fontFamily: "TikTok Sans",
      fontFile: "TikTokSans-Variable.ttf", // or TikTokSans-SemiBold.ttf
      fontWeight: 700,
      fill: "#FFFFFF",
      stroke: "#000000",
      /* Relative to font size */
      strokeRatio: 0.12,
      /* Relative to video height */
      fontSizeRatio: 0.055,
      /* Relative to video width */
      maxWidthRatio: 0.86,
      /* 0.5 = vertical center (matches your reference) */
      yRatio: 0.50,
      lineHeight: 1.15,
      letterSpacing: "-0.01em",
      textAlign: "center",
      /* ASS / FFmpeg mapping notes */
      ass: {
        alignment: 5, // middle-center
        primaryColour: "&H00FFFFFF",
        outlineColour: "&H00000000",
        // Outline ≈ fontSize * strokeRatio (tuned at PlayRes = video size)
      },
    };

    const EXAMPLES = [
      {
        id: "ref",
        title: "Your reference",
        frameClass: "ref",
        // Empty — reference image already has the caption baked in
        text: "",
        overlayNote: true,
      },
      {
        id: "match",
        title: "Style match (same words)",
        frameClass: "blur-a",
        text: "mood bc that wallet pass\nbe paying u $2k per week\nto play games 😁😂😏",
      },
      {
        id: "ex2",
        title: "Example A",
        frameClass: "blur-b",
        text: "when the grind finally\nstarts paying off 💸",
      },
      {
        id: "ex3",
        title: "Example B",
        frameClass: "blur-c",
        text: "nobody:\nme at 3am still editing\nthis one clip 😭",
      },
      {
        id: "ex4",
        title: "Example C (long wrap)",
        frameClass: "blur-a",
        text: "POV you finally booked the client that pays what you're actually worth",
      },
      {
        id: "ex5",
        title: "Example D",
        frameClass: "blur-b",
        text: "that one friend who\nalways says “one more game”\n💀🎮",
      },
    ];

    const root = document.documentElement;
    const grid = document.getElementById("grid");

    function applyStyleToDom() {
      root.style.setProperty("--caption-weight", CAPTION_STYLE.fontWeight);
      root.style.setProperty("--caption-stroke-ratio", CAPTION_STYLE.strokeRatio);
      root.style.setProperty("--caption-size-ratio", CAPTION_STYLE.fontSizeRatio);
      root.style.setProperty("--caption-y", CAPTION_STYLE.yRatio);
      root.style.setProperty("--caption-max-width", CAPTION_STYLE.maxWidthRatio);
      root.style.setProperty("--line-height", CAPTION_STYLE.lineHeight);
    }

    function syncFontSizes() {
      document.querySelectorAll(".frame").forEach((frame) => {
        const caption = frame.querySelector(".caption");
        if (!caption) return;
        const h = frame.getBoundingClientRect().height;
        caption.style.fontSize = `${h * CAPTION_STYLE.fontSizeRatio}px`;
      });
    }

    function dumpSettings() {
      document.getElementById("settingsDump").textContent =
        JSON.stringify(CAPTION_STYLE, null, 2);
    }

    function buildCards() {
      grid.innerHTML = "";
      for (const ex of EXAMPLES) {
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <div class="label">${ex.title}</div>
          <div class="frame ${ex.frameClass}">
            ${
              ex.text
                ? `<div class="caption">${escapeHtml(ex.text)}</div>`
                : ""
            }
          </div>
        `;
        grid.appendChild(card);
      }
      syncFontSizes();
    }

    function escapeHtml(s) {
      return s
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;");
    }

    function bindSliders() {
      const size = document.getElementById("size");
      const stroke = document.getElementById("stroke");
      const y = document.getElementById("y");
      const weight = document.getElementById("weight");

      const sync = () => {
        CAPTION_STYLE.fontSizeRatio = Number(size.value) / 100;
        CAPTION_STYLE.strokeRatio = Number(stroke.value) / 100;
        CAPTION_STYLE.yRatio = Number(y.value) / 100;
        CAPTION_STYLE.fontWeight = Number(weight.value);

        document.getElementById("sizeOut").textContent = `${size.value}%`;
        document.getElementById("strokeOut").textContent = `${stroke.value}%`;
        document.getElementById("yOut").textContent = `${y.value}%`;
        document.getElementById("weightOut").textContent = weight.value;

        applyStyleToDom();
        syncFontSizes();
        dumpSettings();
      };

      [size, stroke, y, weight].forEach((el) => el.addEventListener("input", sync));

      document.getElementById("reset").addEventListener("click", () => {
        size.value = "5.5";
        stroke.value = "12";
        y.value = "50";
        weight.value = "700";
        sync();
      });

      sync();
    }

    applyStyleToDom();
    buildCards();
    bindSliders();
    window.addEventListener("resize", syncFontSizes);
  </script>
</body>
</html>
